<!-- Flowspace Command Refresh: existing login behavior inside the new shared authentication shell. -->
<app-auth-layout [heading]="'heading' | componentT:'login'">
  <span auth-subtitle>{{ 'newToApp' | componentT:'login' }} <a routerLink="/auth/register">{{ 'createAccount' | componentT:'login' }}</a></span>
  <div class="login-form">
    @if (generalError) { <app-alert [message]="generalError | componentT:'login'" /> }
    <div class="oauth-actions"><button class="oauth-button" type="button" [disabled]="loading || !!oauthLoading" (click)="signInWith('google')"><app-oauth-icon provider="google" />{{ 'continueGoogle' | componentT:'login' }}</button><button class="oauth-button" type="button" [disabled]="loading || !!oauthLoading" (click)="signInWith('github')"><app-oauth-icon provider="github" />{{ 'continueGithub' | componentT:'login' }}</button></div>
    @if (providerError) { <app-alert kind="error" [message]="providerError | componentT:'login'" /> }
    <div class="divider"><span></span><small>{{ 'or' | componentT:'login' }}</small><span></span></div>
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label class="field"><span>{{ 'email' | componentT:'login' }}</span><input type="email" formControlName="email" autocomplete="email" [attr.aria-invalid]="emailError" />@if (emailError) { <small class="field__error">{{ errorFor('email') | componentT:'login' }}</small> }</label>
      <label class="field"><span>{{ 'password' | componentT:'login' }}</span><span class="password-field"><input [type]="showPassword ? 'text' : 'password'" formControlName="password" autocomplete="current-password" [attr.aria-invalid]="passwordError" /><button type="button" class="password-toggle" (click)="showPassword = !showPassword" [attr.aria-label]="(showPassword ? 'hidePassword' : 'showPassword') | componentT:'login'"><lucide-icon [img]="showPassword ? EyeOff : Eye" size="16" /></button></span>@if (passwordError) { <small class="field__error">{{ errorFor('password') | componentT:'login' }}</small> }</label>
      <app-button type="submit" [loading]="loading" [disabled]="!!oauthLoading">{{ 'signIn' | componentT:'login' }}</app-button>
    </form>
    <a class="forgot-link" routerLink="/auth/forgot-password">{{ 'forgotPassword' | componentT:'login' }}</a>
  </div>
</app-auth-layout>
